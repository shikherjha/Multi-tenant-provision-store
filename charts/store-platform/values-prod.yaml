# Production overrides (GCP VM / k3s + Cloudflare DNS + Let's Encrypt TLS)
#   helm upgrade --install store-platform ./charts/store-platform \
#     -n store-platform -f ./charts/store-platform/values-prod.yaml
namespace: store-platform

redis:
  enabled: true

operator:
  domainSuffix: "stores.storeos.in"
  storageClass: "local-path"        # k3s default
  ingressClass: "traefik"           # k3s ships with Traefik
  storeTls: true
  maxStores: 50
  provisionTimeout: 600
  maxParallelProvisions: 3
  medusaImage: "medusa-store:full"
  storefrontImage: "store-storefront:latest"

api:
  domainSuffix: "stores.storeos.in"
  maxStoresPerOwner: 10
  maxStoresGlobal: 50
  rateLimit: "30/minute"

ingress:
  className: "traefik"
  dashboardHost: "dashboard.storeos.in"
  apiHost: "api.storeos.in"
  tls: true

# --- NetworkPolicy ---
networkPolicy:
  ingressControllerLabel: "app.kubernetes.io/name: traefik"

# --- Cloudflare R2 (image storage) ---
# Set these from your .env or pass via --set
r2:
  enabled: true
  accessKeyId: ""       # --set r2.accessKeyId=xxx
  secretAccessKey: ""   # --set r2.secretAccessKey=xxx
  accountId: ""         # --set r2.accountId=xxx
  bucket: "store-platform-media"

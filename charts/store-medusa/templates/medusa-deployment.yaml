apiVersion: apps/v1
kind: Deployment
metadata:
  name: medusa-backend
  labels:
    {{- include "store-medusa.medusa.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.medusa.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: medusa-backend
      app.kubernetes.io/instance: {{ .Values.storeName }}
  template:
    metadata:
      labels:
        {{- include "store-medusa.medusa.labels" . | nindent 8 }}
    spec:
      containers:
        - name: medusa
          image: {{ .Values.medusa.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.medusa.port }}
              name: http
              protocol: TCP
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL
            - name: NODE_ENV
              value: "production"
            - name: STORE_CORS
              value: "*"
            - name: ADMIN_CORS
              value: "*"
            - name: AUTH_CORS
              value: "*"
            - name: MEDUSA_BACKEND_URL
              value: "http://{{ .Values.ingress.host }}"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: COOKIE_SECRET
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
            - name: STORE_NAME
              value: {{ .Values.storeName | quote }}
            {{- if .Values.r2.enabled }}
            - name: R2_ACCESS_KEY_ID
              value: {{ .Values.r2.accessKeyId | quote }}
            - name: R2_SECRET_ACCESS_KEY
              value: {{ .Values.r2.secretAccessKey | quote }}
            - name: R2_ACCOUNT_ID
              value: {{ .Values.r2.accountId | quote }}
            - name: R2_BUCKET
              value: {{ .Values.r2.bucket | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.medusa.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.medusa.readinessInitialDelay | default 30 }}
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.medusa.livenessInitialDelay | default 60 }}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.medusa.startupInitialDelay | default 10 }}
            periodSeconds: 10
            failureThreshold: {{ .Values.medusa.startupFailureThreshold | default 30 }}
# Per-store Helm chart values (defaults — overridden by operator at install time)
storeName: ""

# --- PostgreSQL ---
postgres:
  image: postgres:16-alpine
  user: medusa
  password: medusa-secret
  database: medusa
  storageClass: standard
  storageSize: 1Gi
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"

# --- Medusa Backend ---
# Works with both lite (custom express) and full (real MedusaJS v2) images.
# Adjust resources and probe timings based on the image:
#   lite:  fast startup (~5s), low memory (~256Mi)
#   full:  slow startup (~60-120s), high memory (~1Gi), needs migrations
medusa:
  image: medusa-store:latest
  replicas: 1
  port: 9000
  # Probe timings (overridable for full MedusaJS which has longer startup)
  readinessInitialDelay: 30
  livenessInitialDelay: 60
  startupInitialDelay: 10
  startupFailureThreshold: 30
  resources:
    requests:
      cpu: "200m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# --- Storefront ---
storefront:
  image: store-storefront:latest
  replicas: 1
  port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# --- Ingress ---
ingress:
  enabled: true
  className: nginx
  host: ""
  tls: false

# --- Resource Quota (per-store namespace) ---
resourceQuota:
  enabled: true
  pods: "10"
  requestsCpu: "2"
  requestsMemory: "2Gi"
  limitsCpu: "4"
  limitsMemory: "4Gi"
  pvcs: "3"
  storage: "5Gi"

# --- Limit Range (per-container defaults) ---
limitRange:
  enabled: true
  defaultCpu: "250m"
  defaultMemory: "256Mi"
  defaultRequestCpu: "100m"
  defaultRequestMemory: "128Mi"
  maxCpu: "1"
  maxMemory: "1536Mi"

# --- Network Policy ---
networkPolicy:
  enabled: true
  # Configurable ingress controller selector
  # For Nginx (Kind/local):
  ingressControllerSelector:
    app.kubernetes.io/name: ingress-nginx
  # For Traefik (k3s/prod), override with:
  #   app.kubernetes.io/name: traefik

# --- Cloudflare R2 (S3-compatible image storage) ---
r2:
  enabled: false
  accessKeyId: ""
  secretAccessKey: ""
  accountId: ""
  bucket: "store-platform-media"